[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "responsible-ai-compliance-blueprint"
version = "5.0.0"
description = "Enterprise-grade self-audit toolkit for AI systems with 144 checks, advanced security scanning, code quality analysis, 100% OWASP & ISO/IEC 42001 coverage, and 3-5x faster performance"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Responsible AI Toolkit Team", email = "info@example.com"}
]
maintainers = [
    {name = "Responsible AI Toolkit Team", email = "info@example.com"}
]
keywords = [
    "ai-security",
    "compliance",
    "owasp",
    "iso-42001",
    "mlops",
    "ai-governance"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.9.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "jinja2>=3.1.0",
    "rich>=13.0.0",
    "streamlit>=1.28.0",
    "pandas>=2.0.0",
    "plotly>=5.17.0",
    "markdown>=3.5.0",
    "pip-audit>=2.6.0",
    "pipdeptree>=2.13.0",
    "python-json-logger>=2.0.0",
    "prometheus-client>=0.17.0",
    "packaging>=23.0",
    "watchdog>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "black>=23.0.0",
    "mypy>=1.5.0",
    "pre-commit>=3.4.0",
    "mkdocs>=1.5.0",
    "mkdocstrings[python]>=0.23.0",
    "mkdocs-material>=9.4.0",
]
pdf = [
    "weasyprint>=60.0",
    "pypdf>=3.17.0",
]
all = [
    "responsible-ai-compliance-blueprint[dev,pdf]",
]

[project.urls]
Homepage = "https://github.com/yourusername/responsible-ai-compliance-blueprint"
Documentation = "https://github.com/yourusername/responsible-ai-compliance-blueprint/blob/main/README.md"
Repository = "https://github.com/yourusername/responsible-ai-compliance-blueprint"
Issues = "https://github.com/yourusername/responsible-ai-compliance-blueprint/issues"

[project.scripts]
raicb = "raicb.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raicb = ["py.typed", "templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--cov=raicb",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
    "-v",
]

[tool.coverage.run]
source = ["src/raicb"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/site-packages/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py310"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
follow_imports = "normal"
